name: Codex agent-ready issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: codex-agent-ready-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  MAX_PATCH_BYTES: "1048576"
  MAX_CHANGED_FILES: "30"

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      default_branch: ${{ steps.check.outputs.default_branch }}
    steps:
      - name: Check issue and actor authorization
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          issue_number=$(jq -r '.number' <<<"$ISSUE_JSON")
          issue_author=$(jq -r '.user.login' <<<"$ISSUE_JSON")

          if [[ $(jq -r '.state' <<<"$ISSUE_JSON") != open ]]; then
            echo "Issue is not open"
          elif [[ $(jq -r 'has("pull_request")' <<<"$ISSUE_JSON") == true ]]; then
            echo "Pull requests are not eligible"
          elif ! jq -e '.labels | any(.name == "agent-ready")' <<<"$ISSUE_JSON" >/dev/null; then
            echo "Issue did not have agent-ready when it was opened"
          elif jq -e '.labels | any(.name == "codex-processing" or .name == "codex-pr-created")' <<<"$ISSUE_JSON" >/dev/null; then
            echo "Issue is already being processed or has a generated PR"
          else
            author_permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${issue_author}/permission" --jq '.permission' 2>/dev/null || true)
            sender_permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER_LOGIN}/permission" --jq '.permission' 2>/dev/null || true)
            if [[ "$author_permission" =~ ^(write|maintain|admin)$ && "$sender_permission" =~ ^(write|maintain|admin)$ ]]; then
              allowed=true
            else
              echo "Both the issue author and sender must have write, maintain, or admin permission"
            fi
          fi

          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq '.object.sha')
          echo "allowed=$allowed" >>"$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          echo "default_branch=$default_branch" >>"$GITHUB_OUTPUT"

          if [[ "$allowed" == true ]]; then
            jq -n \
              --argjson number "$issue_number" \
              --arg title "$(jq -r '.title' <<<"$ISSUE_JSON")" \
              --arg body "$(jq -r '.body // ""' <<<"$ISSUE_JSON")" \
              --arg base_sha "$base_sha" \
              '{issue_number: $number, title: $title, body: $body, base_sha: $base_sha}' \
              >issue-request.json
          fi

      - name: Upload authorized request
        if: steps.check.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-request-${{ github.event.issue.number }}
          path: issue-request.json
          if-no-files-found: error
          retention-days: 1

  mark-processing:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Mark issue as processing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
            -f name=codex-processing -f color=fbca04 \
            -f description='Codex automation is processing this issue' >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input - <<<'{"labels":["codex-processing"]}' >/dev/null

  implement:
    needs: [authorize, mark-processing]
    runs-on: [self-hosted, moth-watcher-codex]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the authorized commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download authorized request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-request-${{ github.event.issue.number }}
          path: .codex-request
      - name: Run Codex in the isolated local container
        shell: bash
        run: |
          "${MOTH_WATCHER_RUNNER_HOME:?Set MOTH_WATCHER_RUNNER_HOME in the runner service environment}"/run-codex-container.sh \
            .codex-request/issue-request.json
      - name: Upload implementation result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-result-${{ github.event.issue.number }}
          path: .codex-result/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [authorize, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout the authorized base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.authorize.outputs.base_sha }}
          fetch-depth: 0
      - name: Download Codex result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-result-${{ github.event.issue.number }}
          path: .codex-result
      - name: Validate result and apply patch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
        shell: bash
        run: .github/scripts/validate-and-apply-patch.sh .codex-result
      - name: Create Draft PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_ID: ${{ github.run_id }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ needs.authorize.outputs.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/issue-${ISSUE_NUMBER}-${RUN_ID}"
          bot_id=$(gh api "users/${BOT_SLUG}[bot]" --jq '.id')
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Implement issue #${ISSUE_NUMBER} with Codex"
          git push origin "$branch"

          {
            echo "Codex generated this change for #${ISSUE_NUMBER}."
            echo
            cat .codex-result/summary.md
            echo
            echo "## Verification"
            echo
            cat .codex-result/test-results.md
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } >pr-body.md

          pr_url=$(gh pr create --draft --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "[Codex] ${ISSUE_TITLE}" --body-file pr-body.md)
          echo "url=$pr_url" >>"$GITHUB_OUTPUT"

  cleanup:
    needs: [authorize, mark-processing, implement, publish]
    if: always() && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Remove processing state and report outcome
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')
          updated=$(jq -c '[.[] | select(. != "codex-processing" and . != "codex-pr-created")]' <<<"$current")

          if [[ "$PUBLISH_RESULT" == success ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name=codex-pr-created -f color=0e8a16 \
              -f description='Codex automation created a Draft PR' >/dev/null 2>&1 || true
            updated=$(jq -c '. + ["codex-pr-created"] | unique' <<<"$updated")
            body="Codex created a Draft PR: ${PR_URL}"
          else
            body="Codex automation did not create a PR. See the [workflow run](${RUN_URL}) for the non-secret failure details."
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --input - <<<"$(jq -n --argjson labels "$updated" '{labels: $labels}')" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --input - <<<"$(jq -n --arg body "$body" '{body: $body}')" >/dev/null
