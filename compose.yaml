name: moth-watcher-runner

services:
  workspace-init:
    image: ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    user: "0:0"
    command:
      - /bin/sh
      - -euc
      - |
        install -d -o 1000 -g 1000 -m 0755 /runner-work
        chown -R 1000:1000 /runner-work
        chmod 0755 /runner-work
        install -d -o 1000 -g 1000 -m 0755 /admin-runner
        chown -R 1000:1000 /admin-runner
        chmod 0755 /admin-runner
        install -d -o 1000 -g 1000 -m 0755 /runner-state /codex-locks
        install -d -o 1000 -g 1000 -m 0755 /dind-sock
        chown -R 1000:1000 /runner-state /codex-locks /dind-sock
        chmod 0755 /runner-state /codex-locks /dind-sock
    volumes:
      - runner-work:/runner-work
      - admin-runner-state:/admin-runner
      - runner-state:/runner-state
      - codex-locks:/codex-locks
      - dind-sock:/dind-sock
    restart: "no"

  docker-daemon:
    image: docker@sha256:8a213afdd096a44dff403aaf8eb58b7a96a63113f18a4b094b98b7d0ed7d948b
    privileged: true
    command:
      - --host=unix:///dind-sock/docker.sock
      - --group=1000
      - --tls=false
    environment:
      DOCKER_TLS_CERTDIR: ""
    cpus: 4
    mem_limit: 8g
    pids_limit: 512
    volumes:
      - docker-data:/home/rootless/.local/share/docker
      - dind-sock:/dind-sock
      - runner-work:/runner-work
      - type: bind
        source: ${CODEX_AUTH_DIR:?Set CODEX_AUTH_DIR to the dedicated Codex home}
        target: /codex-auth-host
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_HOST=tcp://127.0.0.1:2375 docker info >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  runner-manager:
    build:
      context: .
      dockerfile: github-runner/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      docker-daemon:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker-daemon:2375
      DOCKER_BUILDKIT: "1"
      RUNNER_LABELS: moth-watcher-codex
      RUNNER_MANUALLY_TRAP_SIG: "1"
      MOTH_WATCHER_RUNNER_HOME: /opt/moth-watcher-runner
      CODEX_AUTOMATION_HOME: /codex-auth-host
      RUNNER_CONFIG: /config/repositories.json
      RUNNER_STATE_ROOT: /runner-state
      CODEX_LOCK_DIR: /codex-locks
      GH_AW_DOCKER_SOCK_PATH: /dind-sock/docker.sock
      GH_AW_DOCKER_SOCK_GID: "1000"
    volumes:
      - runner-state:/runner-state
      - runner-work:/runner-work
      - codex-locks:/codex-locks
      - dind-sock:/dind-sock
      - type: bind
        source: ./repositories.json
        target: /config/repositories.json
        read_only: true
    entrypoint: ["/usr/local/bin/runner-manager"]
    stop_grace_period: 1m
    restart: unless-stopped

  repository-admin:
    build:
      context: .
      dockerfile: github-runner/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    environment:
      RUNNER_URL: https://github.com/cre-chan/workflow
      RUNNER_NAME: moth-watcher-repository-admin
      RUNNER_LABELS: moth-watcher-admin
      RUNNER_MANUALLY_TRAP_SIG: "1"
      RUNNER_CONFIG: /config/repositories.json
      RUNNER_STATE_ROOT: /runner-state
      REPOSITORIES_CONFIG: /config/repositories.json
      ADMIN_GITHUB_TOKEN_FILE: /run/secrets/github_admin_token
      MOTH_ADMIN_CONTEXT: "1"
    volumes:
      - admin-runner-state:/runner
      - runner-state:/runner-state
      - type: bind
        source: ./repositories.json
        target: /config/repositories.json
      - type: bind
        source: ${ADMIN_GITHUB_TOKEN_FILE:?Set ADMIN_GITHUB_TOKEN_FILE to the dedicated fine-grained PAT file}
        target: /run/secrets/github_admin_token
        read_only: true
    stop_grace_period: 1m
    restart: unless-stopped

volumes:
  docker-data:
  runner-state:
  runner-work:
  codex-locks:
  admin-runner-state:
  dind-sock:
